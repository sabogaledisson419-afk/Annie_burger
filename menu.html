<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menú Digital | Annie Burger</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
        linear-gradient(rgba(20,0,0,.82),rgba(40,0,0,.82)),
        url("img/logo.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

}

/* Encabezado */

header{
    text-align:center;
    padding:40px 20px;
}

header img{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid #FFD54F;
    box-shadow:0 0 20px rgba(255,213,79,.6);
}

header h1{
    margin-top:15px;
    font-size:42px;
    color:#FFD54F;
}

header p{
    margin-top:10px;
    color:#ddd;
    font-size:18px;
}

/* Contenedor */

.contenedor{

    max-width:900px;
    margin:auto;
    padding:20px;

}

/* Tarjetas */

.tarjeta{

    background:white;
    border-radius:25px;
    margin-bottom:45px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,.45);
    transition:.4s;

}

.tarjeta:hover{

    transform:translateY(-8px);

}

.tarjeta img{

    width:100%;
    display:block;
    transition:.4s;

}

.tarjeta:hover img{

    transform:scale(1.02);

}

.titulo{

    background:#C62828;
    color:white;
    padding:18px;
    font-size:28px;
    font-weight:bold;

}

/* Botón */

.btn{

    display:inline-block;
    margin:40px auto;
    padding:18px 35px;
    background:#FFD54F;
    color:#331010;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:50px;
    transition:.3s;

}

.btn:hover{

    transform:scale(1.05);
    background:white;

}

/* Responsive */

@media(max-width:768px){

header h1{

    font-size:32px;

}

.titulo{

    font-size:22px;

}

}

</style>

</head>

<body>

<header>

<img src="img/logo.png">

<h1>🍔 Annie Burger</h1>

<p>Más que comida rápida... una explosión de sabor</p>

</header>

<div class="contenedor">

<div class="tarjeta">

<div class="titulo">
🍔 Menú Página 1
</div>

<img src="img/menu1.jpg">

</div>

<div class="tarjeta">

<div class="titulo">
🌭 Menú Página 2
</div>

<img src="img/menu2.jpg">

</div>

<div style="text-align:center">

<a href="index.html" class="btn">
🏠 Volver al Inicio
</a>

</div>

</div>

</body>
</html>
